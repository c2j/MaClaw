name: Release Build

on:
  push:
    tags:
      - '[Vv]*'

permissions:
  contents: write

env:
  APP_NAME: MaClaw
  GO_VERSION: '1.25.0'
  NODE_VERSION: '20'

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Extract version from wails.json
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $version = $cfg.info.productVersion
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build frontend
        shell: pwsh
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $manifest = Get-Content build/windows/wails.exe.manifest -Raw
          $manifest = $manifest.Replace('{{.Name}}', $cfg.name).Replace('{{.Info.ProductVersion}}', $env:VERSION)
          [System.IO.File]::WriteAllText("build/windows/wails.exe.manifest.tmp", $manifest, [System.Text.UTF8Encoding]::new($false))
          
          $parts = $env:VERSION.Split('.')
          $versionInfo = @{
            FixedFileInfo = @{
              FileVersion    = @{ Major=[int]$parts[0]; Minor=[int]$parts[1]; Patch=[int]$parts[2]; Build=[int]$parts[3] }
              ProductVersion = @{ Major=[int]$parts[0]; Minor=[int]$parts[1]; Patch=[int]$parts[2]; Build=[int]$parts[3] }
            }
            StringFileInfo = @{
              CompanyName     = $cfg.info.companyName
              FileDescription = $cfg.info.productName
              FileVersion     = $env:VERSION
              ProductName     = $cfg.info.productName
              ProductVersion  = $env:VERSION
              LegalCopyright  = $cfg.info.copyright
            }
            VarFileInfo = @{ Translation = @{ LangID='0409'; CharsetID='04B0' } }
          } | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("build/windows/versioninfo.json.tmp", $versionInfo, [System.Text.UTF8Encoding]::new($false))

          $goversioninfo = Join-Path (go env GOPATH) "bin/goversioninfo.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $goversioninfo -64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest.tmp -o gui/resource_windows_amd64.syso build/windows/versioninfo.json.tmp
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -tags desktop,production -ldflags "-s -w -H windowsgui" -o "dist/${env:APP_NAME}-${env:VERSION}-windows-amd64.exe" ./gui/
          Remove-Item gui/resource_windows_amd64.syso

          & $goversioninfo -64 -arm -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest.tmp -o gui/resource_windows_arm64.syso build/windows/versioninfo.json.tmp
          $env:GOARCH='arm64'
          go build -tags desktop,production -ldflags "-s -w -H windowsgui" -o "dist/${env:APP_NAME}-${env:VERSION}-windows-arm64.exe" ./gui/
          Remove-Item gui/resource_windows_arm64.syso

          Remove-Item build/windows/wails.exe.manifest.tmp, build/windows/versioninfo.json.tmp

      - name: Build Windows TUI & Tool
        shell: pwsh
        run: |
          $ldflags = "-s -w -X main.version=$env:VERSION"
          $env:GOOS='windows'; $env:CGO_ENABLED='0'
          
          $env:GOARCH='amd64'
          go build -ldflags $ldflags -o "dist/maclaw-tui-${env:VERSION}-windows-amd64.exe" ./tui/
          go build -ldflags $ldflags -o "dist/maclaw-tool-${env:VERSION}-windows-amd64.exe" ./cmd/maclaw-tool/
          
          $env:GOARCH='arm64'
          go build -ldflags $ldflags -o "dist/maclaw-tui-${env:VERSION}-windows-arm64.exe" ./tui/
          go build -ldflags $ldflags -o "dist/maclaw-tool-${env:VERSION}-windows-arm64.exe" ./cmd/maclaw-tool/

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Create NSIS installer
        shell: pwsh
        run: |
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $root = (Get-Location).Path
          & $nsis /DINFO_PROJECTNAME="$env:APP_NAME" `
                  /DPRODUCT_EXECUTABLE="${env:APP_NAME}.exe" `
                  /DINFO_PRODUCTNAME="$($cfg.info.productName)" `
                  /DINFO_COMPANYNAME="$($cfg.info.companyName)" `
                  /DINFO_COPYRIGHT="$($cfg.info.copyright)" `
                  /DINFO_PRODUCTVERSION="$env:VERSION" `
                  /DARG_WAILS_AMD64_BINARY="$root\dist\${env:APP_NAME}-${env:VERSION}-windows-amd64.exe" `
                  /DARG_WAILS_ARM64_BINARY="$root\dist\${env:APP_NAME}-${env:VERSION}-windows-arm64.exe" `
                  build/windows/installer/multiarch.nsi
          Rename-Item "dist/${env:APP_NAME}-Setup.exe" "dist/${env:APP_NAME}-${env:VERSION}-windows-setup.exe"

      - name: Create portable zip
        shell: pwsh
        run: |
          Copy-Item "dist/${env:APP_NAME}-${env:VERSION}-windows-amd64.exe" "dist/${env:APP_NAME}.exe"
          Copy-Item "dist/maclaw-tui-${env:VERSION}-windows-amd64.exe" "dist/maclaw-tui.exe"
          Copy-Item "dist/maclaw-tool-${env:VERSION}-windows-amd64.exe" "dist/maclaw-tool.exe"
          Compress-Archive -Path "dist/${env:APP_NAME}.exe","dist/maclaw-tui.exe","dist/maclaw-tool.exe" `
            -DestinationPath "dist/${env:APP_NAME}-${env:VERSION}-windows-portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/${{ env.APP_NAME }}-*-windows-*.exe
            dist/${{ env.APP_NAME }}-*-windows-*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Extract version from wails.json
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Build macOS GUI binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          mkdir -p dist build/bin
          CGO_ENABLED=1 CGO_LDFLAGS="-weak_framework UniformTypeIdentifiers" \
            GOOS=darwin GOARCH=amd64 \
            go build -tags desktop,production -o "dist/${APP_NAME}-${VERSION}-darwin-amd64" ./gui/
          CGO_ENABLED=1 CGO_LDFLAGS="-weak_framework UniformTypeIdentifiers" \
            GOOS=darwin GOARCH=arm64 \
            go build -tags desktop,production -o "dist/${APP_NAME}-${VERSION}-darwin-arm64" ./gui/

      - name: Build macOS TUI & Tool
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tui-${VERSION}-darwin-amd64" ./tui/
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tool-${VERSION}-darwin-amd64" ./cmd/maclaw-tool/
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tui-${VERSION}-darwin-arm64" ./tui/
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tool-${VERSION}-darwin-arm64" ./cmd/maclaw-tool/

      - name: Generate .icns
        run: |
          if [ -f build/appicon.png ]; then
            ICONSET=build/appicon.iconset
            mkdir -p "$ICONSET"
            for sz in 16 32 64 128 256 512 1024; do
              sips -z $sz $sz build/appicon.png --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null
            done
            cp "$ICONSET/icon_32x32.png"   "$ICONSET/icon_16x16@2x.png"
            cp "$ICONSET/icon_64x64.png"   "$ICONSET/icon_32x32@2x.png"
            cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
            cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png"
            cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png"
            rm -f "$ICONSET/icon_64x64.png" "$ICONSET/icon_1024x1024.png"
            iconutil -c icns "$ICONSET" -o build/AppIcon.icns
            rm -rf "$ICONSET"
          fi

      - name: Create App Bundles
        run: |
          IDENTIFIER="com.wails.MaClaw"
          
          for ARCH in amd64 arm64; do
            BUNDLE="dist/${APP_NAME}-${VERSION}-darwin-${ARCH}.app"
            mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
            cp "dist/${APP_NAME}-${VERSION}-darwin-${ARCH}" "$BUNDLE/Contents/MacOS/${APP_NAME}"
            chmod +x "$BUNDLE/Contents/MacOS/${APP_NAME}"
            [ -f build/AppIcon.icns ] && cp build/AppIcon.icns "$BUNDLE/Contents/Resources/"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' > "$BUNDLE/Contents/Info.plist"
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$BUNDLE/Contents/Info.plist"
            printf '%s\n' '<plist version="1.0"><dict>' >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundlePackageType' 'APPL' >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleName' "${APP_NAME}" >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleExecutable' "${APP_NAME}" >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleIdentifier' "${IDENTIFIER}" >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleVersion' "${VERSION}" >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleShortVersionString' "${VERSION}" >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'CFBundleIconFile' 'AppIcon' >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'LSMinimumSystemVersion' '10.15.0' >> "$BUNDLE/Contents/Info.plist"
            printf '  <key>%s</key><string>%s</string>\n' 'NSHighResolutionCapable' 'true' >> "$BUNDLE/Contents/Info.plist"
            printf '%s\n' '</dict></plist>' >> "$BUNDLE/Contents/Info.plist"
            rm "dist/${APP_NAME}-${VERSION}-darwin-${ARCH}"
          done

      - name: Create Universal Binary
        run: |
          UBUNDLE="dist/${APP_NAME}-${VERSION}-darwin-universal.app"
          mkdir -p "$UBUNDLE/Contents/MacOS" "$UBUNDLE/Contents/Resources"
          lipo -create "dist/${APP_NAME}-${VERSION}-darwin-amd64.app/Contents/MacOS/${APP_NAME}" \
            "dist/${APP_NAME}-${VERSION}-darwin-arm64.app/Contents/MacOS/${APP_NAME}" \
            -output "$UBUNDLE/Contents/MacOS/${APP_NAME}"
          cp "dist/${APP_NAME}-${VERSION}-darwin-arm64.app/Contents/Info.plist" "$UBUNDLE/Contents/Info.plist"
          cp -R "dist/${APP_NAME}-${VERSION}-darwin-arm64.app/Contents/Resources/" "$UBUNDLE/Contents/Resources/"

      - name: Create PKGs
        run: |
          IDENTIFIER="com.wails.MaClaw"
          
          for ARCH in amd64 arm64 universal; do
            BUNDLE="dist/${APP_NAME}-${VERSION}-darwin-${ARCH}.app"
            PKG_NAME="${APP_NAME}-${VERSION}-darwin-${ARCH}.pkg"
            [ "$ARCH" = "amd64" ] && SCRIPTS_DIR="build/scripts_x64"
            [ "$ARCH" = "arm64" ] && SCRIPTS_DIR="build/scripts_arm64"
            [ "$ARCH" = "universal" ] && SCRIPTS_DIR="build/scripts_universal"
            
            TEMP_ROOT="build/pkg_root_${ARCH}"
            rm -rf "$TEMP_ROOT"
            mkdir -p "$TEMP_ROOT/Applications"
            cp -R "$BUNDLE" "$TEMP_ROOT/Applications/${APP_NAME}.app"
            chmod +x "$SCRIPTS_DIR/preinstall" "$SCRIPTS_DIR/postinstall"
            pkgbuild --root "$TEMP_ROOT" --identifier "$IDENTIFIER" --version "$VERSION" \
              --install-location "/" --scripts "$SCRIPTS_DIR" "dist/${PKG_NAME}"
            rm -rf "$TEMP_ROOT"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/${{ env.APP_NAME }}-*-darwin-*.pkg
            dist/maclaw-*-${{ env.VERSION }}-darwin-*

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          if sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev 2>/dev/null; then
            echo "WEBKIT_TAGS=desktop,production" >> $GITHUB_ENV
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
            echo "WEBKIT_TAGS=desktop,production,webkit2_41" >> $GITHUB_ENV
          fi

      - name: Extract version from wails.json
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Build Linux GUI (amd64)
        run: |
          mkdir -p dist build/bin
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags "${WEBKIT_TAGS}" -o "dist/${APP_NAME}-${VERSION}-linux-amd64" ./gui/

      - name: Build Linux TUI & Tool (amd64)
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tui-${VERSION}-linux-amd64" ./tui/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "$LDFLAGS" -o "dist/maclaw-tool-${VERSION}-linux-amd64" ./cmd/maclaw-tool/

      - name: Create AppImage (amd64)
        run: |
          APP_DIR="build/linux/AppDir_amd64"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin"
          mkdir -p "$APP_DIR/usr/share/icons/hicolor/512x512/apps"
          cp "dist/${APP_NAME}-${VERSION}-linux-amd64" "$APP_DIR/usr/bin/maclaw"
          cp build/appicon.png "$APP_DIR/maclaw.png"
          cp build/appicon.png "$APP_DIR/.DirIcon"

          cat > "$APP_DIR/maclaw.desktop" << 'DEOF'
[Desktop Entry]
Name=MaClaw
Exec=maclaw
Icon=maclaw
Type=Application
Categories=Development;
DEOF

          cat > "$APP_DIR/AppRun" << 'REOF'
#!/bin/bash
HERE="$(dirname "$(readlink -f "${0}")")"
export PATH="${HERE}/usr/bin:${PATH}"
exec maclaw "$@"
REOF
          chmod +x "$APP_DIR/AppRun"

          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP_DIR" \
            "dist/${APP_NAME}-${VERSION}-linux-amd64.AppImage"

      - name: Upload Linux amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-artifacts
          path: |
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-linux-amd64*
            dist/maclaw-*-${{ env.VERSION }}-linux-amd64

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd gui/frontend
          npm ci --cache ./.npm_cache
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux arm64 binaries in container
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('wails.json'))['info']['productVersion'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERSION="$VERSION" \
            -e APP_NAME="${{ env.APP_NAME }}" \
            arm64v8/golang:${{ env.GO_VERSION }}-bookworm \
            bash -c "
              apt-get update && apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev gcc
              mkdir -p dist
              
              CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
                go build -tags desktop,production -o dist/${{ env.APP_NAME }}-${VERSION}-linux-arm64 ./gui/
              
              LDFLAGS=\"-s -w -X main.version=$VERSION\"
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
                go build -ldflags \\\"\$LDFLAGS\\\" -o dist/maclaw-tui-${VERSION}-linux-arm64 ./tui/
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
                go build -ldflags \\\"\$LDFLAGS\\\" -o dist/maclaw-tool-${VERSION}-linux-arm64 ./cmd/maclaw-tool/
            "

      - name: Create AppImage (arm64)
        run: |
          APP_DIR="build/linux/AppDir_arm64"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin"
          mkdir -p "$APP_DIR/usr/share/icons/hicolor/512x512/apps"
          cp "dist/${APP_NAME}-${VERSION}-linux-arm64" "$APP_DIR/usr/bin/maclaw"
          cp build/appicon.png "$APP_DIR/maclaw.png"
          cp build/appicon.png "$APP_DIR/.DirIcon"

          cat > "$APP_DIR/maclaw.desktop" << 'DEOF'
[Desktop Entry]
Name=MaClaw
Exec=maclaw
Icon=maclaw
Type=Application
Categories=Development;
DEOF

          cat > "$APP_DIR/AppRun" << 'REOF'
#!/bin/bash
HERE="$(dirname "$(readlink -f "${0}")")"
export PATH="${HERE}/usr/bin:${PATH}"
exec maclaw "$@"
REOF
          chmod +x "$APP_DIR/AppRun"

          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x appimagetool
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run "$APP_DIR" \
            "dist/${APP_NAME}-${VERSION}-linux-arm64.AppImage"

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            dist/${{ env.APP_NAME }}-${{ env.VERSION }}-linux-arm64*
            dist/maclaw-*-${{ env.VERSION }}-linux-arm64

  release:
    needs: [build-windows, build-macos, build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
